name: Burgundy Project
version: 0.7.6
slug: burgundy_project
description: Toss account monitoring and gated strategy automation
arch:
- amd64
startup: application
boot: auto
init: true
ingress: true
ingress_port: 8099
panel_icon: mdi:glass-wine
panel_title: Burgundy Project
panel_admin: true
stage: experimental
backup: cold
timeout: 30
services:
- mqtt:want
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: null
options:
  primary_account:
    alias: 계좌 1
    client_id: ''
    client_secret: ''
    account_seq: ''
  secondary_account:
    alias: 계좌 2
    client_id: ''
    client_secret: ''
    account_seq: ''
  telegram:
    enabled: false
    bot_token: ''
    chat_id: ''
    report_times_kst:
    - 07:15
    - '16:10'
  mqtt:
    enabled: true
    host: core-mosquitto
    port: 1883
    username: ''
    password: ''
    tls: false
  system:
    poll_seconds: 60
    retention_days: 30
    instance_id: toss_monitor
    ip_check_enabled: true
    allow_live_trading: false
schema:
  primary_account:
    alias: str
    client_id: password
    client_secret: password
    account_seq: str
  secondary_account:
    alias: str
    client_id: password
    client_secret: password
    account_seq: str
  telegram:
    enabled: bool
    bot_token: password
    chat_id: str
    report_times_kst:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  mqtt:
    enabled: bool
    host: str
    port: port
    username: str
    password: password
    tls: bool
  system:
    poll_seconds: int(30,3600)
    retention_days: int(1,365)
    instance_id: match(^[a-z][a-z0-9_]{2,31}$)
    ip_check_enabled: bool
    allow_live_trading: bool
image: ghcr.io/hytecahn/burgundy-project
url: https://github.com/hytecahn/burgundy-project
